<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METEOR SHIELD</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; }
#gc { position:relative; width:100vw; height:100vh; }
#webcam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); z-index:1; }
#gameCanvas { position:absolute; inset:0; width:100%; height:100%; z-index:2; }
#handCanvas { position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; }

#startScreen {
  position:absolute; inset:0; z-index:10;
  background:radial-gradient(ellipse at 50% 30%, #1a0535 0%, #0a0015 60%, #000 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem;
}
.title-wrap { text-align:center; line-height:1; }
.title-sub { font-family:'Bangers',cursive; font-size:clamp(1rem,2.5vw,1.8rem); color:#ff9900; letter-spacing:0.4em; margin-bottom:0.3rem; }
.title-main { font-family:'Bangers',cursive; font-size:clamp(4rem,11vw,9rem); color:#fff;
  -webkit-text-stroke:3px #ff4400;
  text-shadow:0 0 30px #ff6600, 0 0 80px #ff2200, 4px 4px 0 #880000;
  letter-spacing:0.05em; }
.title-fire { color:#ff6600; -webkit-text-stroke:3px #ffaa00; text-shadow:0 0 40px #ffaa00,0 0 100px #ff6600, 4px 4px 0 #442200; }

.howto { display:flex; gap:1.5rem; flex-wrap:wrap; justify-content:center; max-width:700px; }
.howto-card {
  background:rgba(255,80,0,0.1); border:1.5px solid rgba(255,120,0,0.35);
  border-radius:16px; padding:1rem 1.2rem; text-align:center; min-width:160px;
}
.howto-card .icon { font-size:2.2rem; display:block; margin-bottom:0.4rem; }
.howto-card p { font-family:'Nunito',sans-serif; font-size:0.85rem; color:#ffcc88; line-height:1.4; }
.howto-card strong { color:#ff9944; display:block; font-size:1rem; margin-bottom:0.2rem; }

#startBtn {
  font-family:'Bangers',cursive; font-size:2rem; letter-spacing:0.15em;
  padding:0.7rem 3.5rem; border-radius:60px; border:none; cursor:pointer;
  background:linear-gradient(135deg,#ff5500,#ff9900);
  color:#fff; text-shadow:1px 1px 0 #882200;
  box-shadow:0 0 30px rgba(255,100,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
  transition:transform 0.15s, box-shadow 0.15s;
}
#startBtn:hover { transform:scale(1.07); box-shadow:0 0 50px rgba(255,120,0,1); }

#cdScreen {
  position:absolute; inset:0; z-index:9;
  background:rgba(0,0,0,0.55); display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:1rem;
}
#cdNum {
  font-family:'Bangers',cursive; font-size:35vw; color:rgba(255,140,0,0.75);
  text-shadow:0 0 80px rgba(255,80,0,0.9);
  animation:cdPop 0.7s cubic-bezier(.2,1.4,.6,1);
  line-height:1;
}
@keyframes cdPop { 0%{transform:scale(2);opacity:0} 100%{transform:scale(1);opacity:1} }

#ui {
  position:absolute; top:0; left:0; right:0; z-index:8;
  padding:1rem 1.5rem; display:none;
  justify-content:space-between; align-items:flex-start; pointer-events:none;
}
.ui-pill {
  font-family:'Bangers',cursive; font-size:1.8rem; letter-spacing:0.1em;
  background:rgba(0,0,0,0.55); border:1.5px solid rgba(255,140,0,0.4);
  border-radius:12px; padding:0.4rem 1.2rem; color:#ffaa44;
  text-shadow:0 0 15px #ff6600;
}
#hpWrap { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
#hpLabel { font-family:'Bangers',cursive; font-size:1rem; letter-spacing:0.2em; color:#ff9944; }
#hpBar { width:180px; height:14px; background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,140,0,0.35); border-radius:7px; overflow:hidden; }
#hpFill { height:100%; width:100%; background:linear-gradient(90deg,#ff3300,#ffaa00); border-radius:7px; transition:width 0.4s, background 0.4s; }

#gesture-status {
  position:absolute; bottom:220px; left:50%; transform:translateX(-50%);
  z-index:8; font-family:'Bangers',cursive; font-size:1.4rem; letter-spacing:0.15em;
  color:rgba(255,200,80,0.9); text-shadow:0 0 20px #ff8800;
  background:rgba(0,0,0,0.4); border-radius:10px; padding:0.3rem 1.2rem;
  display:none; pointer-events:none; transition:opacity 0.3s;
}

#endScreen {
  position:absolute; inset:0; z-index:10; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:1.5rem;
}
#endTitle { font-family:'Bangers',cursive; font-size:clamp(4rem,14vw,11rem); letter-spacing:0.08em; animation:cdPop 0.8s ease-out; line-height:1; }
#endSub { font-family:'Nunito',sans-serif; font-size:1.3rem; color:rgba(255,255,255,0.75); letter-spacing:0.1em; }
#replayBtn {
  font-family:'Bangers',cursive; font-size:1.5rem; letter-spacing:0.2em;
  padding:0.6rem 2.5rem; border-radius:50px;
  background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.35);
  color:#fff; cursor:pointer; transition:background 0.2s;
}
#replayBtn:hover { background:rgba(255,255,255,0.22); }
</style>
</head>
<body>
<div id="gc">
  <video id="webcam" autoplay muted playsinline></video>
  <canvas id="gameCanvas"></canvas>
  <canvas id="handCanvas"></canvas>

  <div id="startScreen">
    <div class="title-wrap">
      <div class="title-sub">🔥 PROTECT YOUR CITY 🔥</div>
      <div class="title-main">METEOR <span class="title-fire">SHIELD</span></div>
    </div>
    <div class="howto">
      <div class="howto-card"><span class="icon">✊</span><strong>1 Fist</strong><p>Charge a small fireball between your fingers</p></div>
      <div class="howto-card"><span class="icon">🤲</span><strong>Both Hands</strong><p>Cup hands together for a MEGA fireball!</p></div>
      <div class="howto-card"><span class="icon">👋</span><strong>Flick!</strong><p>Open hand fast to launch it at meteors</p></div>
      <div class="howto-card"><span class="icon">⏱️</span><strong>Survive 2 min</strong><p>Don't let meteors destroy your city!</p></div>
    </div>
    <button id="startBtn" onclick="initGame()">▶ PLAY NOW</button>
  </div>

  <div id="cdScreen"><div id="cdNum">3</div></div>

  <div id="ui">
    <div class="ui-pill" id="timerPill">2:00</div>
    <div class="ui-pill" id="scorePill">⭐ 0</div>
    <div id="hpWrap">
      <div id="hpLabel">🏙️ CITY HP</div>
      <div id="hpBar"><div id="hpFill"></div></div>
    </div>
  </div>

  <div id="gesture-status"></div>

  <div id="endScreen">
    <div id="endTitle"></div>
    <div id="endSub"></div>
    <button id="replayBtn" onclick="restartGame()">↺ PLAY AGAIN</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
<script>
const gc = document.getElementById('gameCanvas');
const ctx = gc.getContext('2d');
const hc = document.getElementById('handCanvas');
const hctx = hc.getContext('2d');
const vid = document.getElementById('webcam');
const gstatus = document.getElementById('gesture-status');

let W, H;
function resize() { W = gc.width = hc.width = window.innerWidth; H = gc.height = hc.height = window.innerHeight; buildCity(); }
resize(); window.addEventListener('resize', resize);

// ── State ──────────────────────────────────────────
let state = 'start';
let cityHp = 100, score = 0, timeLeft = 120;
let gTimer, sTimer;
let meteors=[], balls=[], exps=[], particles=[], stars=[];
let cityDmg = Array(8).fill(0); // 8 sections
let shakeX=0, shakeY=0, frame=0;

// ── Hand state ──────────────────────────────────────
let hands = [];
let charging = false, chargeT = 0, chargeAmt = 0;
let fbPos = {x:0,y:0};
let bothHands = false;
let prevFbY = 0;
let statusTimeout;

function showStatus(txt) {
  gstatus.textContent = txt;
  gstatus.style.display = 'block';
  clearTimeout(statusTimeout);
  statusTimeout = setTimeout(()=>{ gstatus.style.display='none'; }, 2000);
}

// ── Stars ───────────────────────────────────────────
function makeStars() {
  stars = [];
  for(let i=0;i<120;i++) stars.push({x:Math.random()*W, y:Math.random()*H*0.65, r:Math.random()*1.2, twinkle:Math.random()*Math.PI*2});
}
makeStars();

// ── City Buildings ──────────────────────────────────
let buildings = [];
const CITY_Y = () => H * 0.72;
const SEC_W = () => W / 8;

function buildCity() {
  buildings = [];
  const sw = W/8;
  const colors = [['#1a4a6e','#2a6a9e','#0d2a40'],['#1e3a5f','#2e5a8f','#0f2035'],['#162d4a','#245080','#0a1e30']];
  for(let s=0;s<8;s++) {
    const sec = []; let bx = s*sw + 2;
    while(bx < (s+1)*sw - 4) {
      const bw = 22+Math.random()*32, bh = H*0.1 + Math.random()*H*0.22;
      const col = colors[Math.floor(Math.random()*colors.length)];
      const wins = [];
      for(let wy=8;wy<bh-12;wy+=13) for(let wx=4;wx<bw-6;wx+=10) wins.push({x:wx,y:wy,on:Math.random()>0.25});
      sec.push({x:bx, w:bw, h:bh, col, wins, antenna: Math.random()>0.6});
      bx += bw+2+Math.random()*4;
    }
    buildings.push(sec);
  }
}

// ── Draw City ───────────────────────────────────────
function drawCity() {
  const cy = CITY_Y(), sw = SEC_W();
  // Water/ground
  const wg = ctx.createLinearGradient(0,cy+10,0,H);
  wg.addColorStop(0,'#0a2535'); wg.addColorStop(1,'#050d15');
  ctx.fillStyle=wg; ctx.fillRect(0,cy+10,W,H-cy-10);
  // Wave shimmer
  ctx.strokeStyle='rgba(30,120,180,0.3)'; ctx.lineWidth=1;
  for(let wx=0;wx<W;wx+=60) {
    ctx.beginPath(); ctx.moveTo(wx,cy+14+Math.sin(frame*0.04+wx*0.02)*3);
    ctx.lineTo(wx+30,cy+16+Math.sin(frame*0.04+wx*0.02+1)*3); ctx.stroke();
  }

  buildings.forEach((sec,si) => {
    const dmg = cityDmg[si];
    sec.forEach(b => {
      const by = cy - b.h;
      // Shadow/glow from fire
      if(dmg>0) {
        const sg = ctx.createRadialGradient(b.x+b.w/2,cy,0,b.x+b.w/2,cy,b.w*2);
        sg.addColorStop(0,`rgba(255,80,0,${dmg*0.12})`); sg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=sg; ctx.fillRect(b.x-b.w,by-20,b.w*4,b.h+40);
      }
      // Building body
      const wallCol = dmg===0? b.col[0]: dmg===1? '#2a1a08': dmg===2? '#3a1008': '#1a0500';
      ctx.fillStyle=wallCol; ctx.fillRect(b.x,by,b.w,b.h);
      // Highlight edge
      ctx.fillStyle = dmg===0? b.col[1]: 'rgba(255,60,0,0.3)';
      ctx.fillRect(b.x,by,2,b.h);
      // Roof
      ctx.fillStyle = dmg===0? b.col[2]: '#150500'; ctx.fillRect(b.x,by,b.w,5);
      // Antenna
      if(b.antenna && dmg<3) { ctx.strokeStyle=dmg===0?'#4a8aae':'#553300'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(b.x+b.w/2,by); ctx.lineTo(b.x+b.w/2,by-12); ctx.stroke(); }
      // Windows
      if(dmg<3) b.wins.forEach(w => {
        if(dmg>0&&Math.random()<0.003) w.on=!w.on;
        const wc = dmg===0? (w.on?'rgba(200,230,255,0.95)':'rgba(10,30,50,0.8)'): (w.on?'rgba(255,140,0,0.9)':'rgba(30,8,0,0.7)');
        ctx.fillStyle=wc; ctx.fillRect(b.x+w.x,by+w.y,6,5);
        if(w.on && dmg===0) { ctx.fillStyle='rgba(150,200,255,0.15)'; ctx.fillRect(b.x+w.x-1,by+w.y-1,8,7); }
      });
      // Fire on damaged
      if(dmg>=2) {
        for(let fi=0;fi<4;fi++) {
          const fx=b.x+b.w*(fi+0.3)/4, fy=by+Math.sin(frame*0.12+fi*1.3)*4;
          const size=14+dmg*8+Math.sin(frame*0.2+fi)*5;
          const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,size);
          fg.addColorStop(0,'rgba(255,230,80,0.9)'); fg.addColorStop(0.4,'rgba(255,80,0,0.7)'); fg.addColorStop(1,'rgba(255,0,0,0)');
          ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(fx,fy,size,0,Math.PI*2); ctx.fill();
        }
      }
      // Rubble hint at base
      if(dmg>=3) { ctx.fillStyle='rgba(80,30,0,0.6)'; ctx.fillRect(b.x-2,cy-8,b.w+4,12); }
    });
    // Ground strip per section
    ctx.fillStyle = dmg>1? '#1a0800': '#0c2030';
    ctx.fillRect(si*sw, cy, sw, 12);
    // Road markings
    if(dmg<2) { ctx.fillStyle='rgba(200,220,255,0.08)'; ctx.fillRect(si*sw+sw*0.45,cy+4,sw*0.1,6); }
  });
}

// ── Sky & Stars ──────────────────────────────────────
function drawSky() {
  // Atmospheric overlay
  const sg = ctx.createLinearGradient(0,0,0,CITY_Y());
  const danger = 1 - cityHp/100;
  sg.addColorStop(0,`rgba(5,0,15,0.72)`);
  sg.addColorStop(0.6,`rgba(${10+danger*40},${3+danger*5},${20+danger*5},0.5)`);
  sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,CITY_Y());
  // Stars
  stars.forEach(s => {
    s.twinkle+=0.03;
    const alpha=0.3+Math.sin(s.twinkle)*0.35;
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  // Moon
  ctx.fillStyle='rgba(200,210,255,0.15)';
  ctx.beginPath(); ctx.arc(W*0.85,H*0.08,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(180,195,240,0.08)';
  ctx.beginPath(); ctx.arc(W*0.85,H*0.08,42,0,Math.PI*2); ctx.fill();
}

// ── Particles ────────────────────────────────────────
function tickParticles() {
  particles = particles.filter(p=>p.life>0.02);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity||0.1; p.life-=p.decay||0.015; p.size*=0.97;
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.5,p.size),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}
function burst(x,y,n,cols,sizeRange,speedRange,gravity) {
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, spd=speedRange[0]+Math.random()*(speedRange[1]-speedRange[0]);
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,size:sizeRange[0]+Math.random()*(sizeRange[1]-sizeRange[0]),color:cols[Math.floor(Math.random()*cols.length)],life:0.9+Math.random()*0.3,decay:0.012+Math.random()*0.015,gravity:gravity??0.12});
  }
}

// ── Meteor ───────────────────────────────────────────
class Meteor {
  constructor(){
    this.x = W*0.05 + Math.random()*W*0.9;
    this.y = -70;
    this.tx = W*0.05 + Math.random()*W*0.9;
    this.size = 20+Math.random()*22;
    const spd = 1.8+(120-timeLeft)/55;
    const ang = Math.atan2(CITY_Y()-this.y, this.tx-this.x);
    this.vx = Math.cos(ang)*spd*0.25;
    this.vy = spd+Math.random()*1.8;
    this.rot = Math.random()*Math.PI*2;
    this.rspd = (Math.random()-0.5)*0.07;
    this.trail=[];
    this.alive=true;
    this.glow=Math.random()*Math.PI*2;
    this.cracks=Array.from({length:5},()=>({a:Math.random()*Math.PI*2,l:0.3+Math.random()*0.5}));
  }
  update(){
    this.x+=this.vx; this.y+=this.vy; this.rot+=this.rspd; this.glow+=0.12;
    this.trail.unshift({x:this.x,y:this.y,a:1});
    if(this.trail.length>22) this.trail.pop();
    this.trail.forEach((t,i)=>t.a=1-i/22);
    return this.y>CITY_Y();
  }
  draw(){
    // Trail
    this.trail.forEach((t,i)=>{
      const r=this.size*(1-i/22)*0.55;
      const tg=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,r);
      tg.addColorStop(0,`rgba(255,${120+Math.floor(i)},0,${t.a*0.55})`);
      tg.addColorStop(0.5,`rgba(220,50,0,${t.a*0.25})`);
      tg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=tg; ctx.beginPath(); ctx.arc(t.x,t.y,r,0,Math.PI*2); ctx.fill();
    });
    // Atmosphere glow
    const ag=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size*2.2);
    ag.addColorStop(0,`rgba(255,150,0,${0.25+Math.sin(this.glow)*0.1})`);
    ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(this.x,this.y,this.size*2.2,0,Math.PI*2); ctx.fill();
    // Body
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.beginPath();
    const pts=9;
    for(let i=0;i<pts;i++){
      const a=(i/pts)*Math.PI*2;
      const r=this.size*(0.72+Math.cos(a*4+this.glow*0.5)*0.14);
      i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath();
    const bg=ctx.createRadialGradient(-this.size*0.3,-this.size*0.3,0,0,0,this.size);
    bg.addColorStop(0,'#cc7744'); bg.addColorStop(0.35,'#7a3318'); bg.addColorStop(0.7,'#3a1508'); bg.addColorStop(1,'#150500');
    ctx.fillStyle=bg; ctx.fill();
    // Lava cracks
    this.cracks.forEach(c=>{
      ctx.strokeStyle=`rgba(255,${100+Math.floor(Math.sin(this.glow+c.a)*60)},0,${0.5+Math.sin(this.glow)*0.3})`;
      ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(c.a)*this.size*c.l,Math.sin(c.a)*this.size*c.l); ctx.stroke();
    });
    // Highlight
    ctx.fillStyle='rgba(255,180,80,0.2)';
    ctx.beginPath(); ctx.ellipse(-this.size*0.3,-this.size*0.3,this.size*0.35,this.size*0.2,Math.PI/4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ── Thrown Fireball ──────────────────────────────────
class Ball {
  constructor(x,y,vx,vy,big){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.size=big?40:24; this.big=big; this.alive=true;
    this.trail=[]; this.phase=Math.random()*Math.PI*2;
  }
  update(){
    this.x+=this.vx; this.y+=this.vy; this.phase+=0.18;
    this.trail.unshift({x:this.x,y:this.y});
    if(this.trail.length>14) this.trail.pop();
    if(this.x<-120||this.x>W+120||this.y<-120||this.y>H+120) this.alive=false;
  }
  draw(){
    const sz=this.size;
    this.trail.forEach((t,i)=>{
      const r=sz*(1-i/14)*0.7;
      const tg=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,r);
      tg.addColorStop(0,`rgba(255,220,60,${(1-i/14)*0.65})`);
      tg.addColorStop(0.5,`rgba(255,80,0,${(1-i/14)*0.35})`);
      tg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=tg; ctx.beginPath(); ctx.arc(t.x,t.y,r,0,Math.PI*2); ctx.fill();
    });
    const cg=ctx.createRadialGradient(this.x-sz*0.2,this.y-sz*0.2,0,this.x,this.y,sz);
    cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.15,'#ffee44'); cg.addColorStop(0.5,'#ff7700'); cg.addColorStop(1,'rgba(255,30,0,0.05)');
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(this.x,this.y,sz,0,Math.PI*2); ctx.fill();
    for(let i=0;i<7;i++){
      const a=(i/7)*Math.PI*2+this.phase;
      const fx=this.x+Math.cos(a)*sz*0.85, fy=this.y+Math.sin(a)*sz*0.85;
      const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,sz*0.38);
      fg.addColorStop(0,`rgba(255,${160+Math.floor(Math.sin(this.phase+i)*50)},0,0.8)`);
      fg.addColorStop(1,'rgba(255,40,0,0)');
      ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(fx,fy,sz*0.38,0,Math.PI*2); ctx.fill();
    }
    if(this.big){
      ctx.strokeStyle=`rgba(255,220,80,${0.4+Math.sin(this.phase)*0.3})`;
      ctx.lineWidth=2; ctx.beginPath(); ctx.arc(this.x,this.y,sz*1.3,0,Math.PI*2); ctx.stroke();
    }
  }
}

// ── Charging fireball drawing ────────────────────────
function drawChargeFB(){
  if(!charging||chargeAmt<5) return;
  const pct=chargeAmt/100, sz=bothHands?(25+chargeAmt*0.55):(14+chargeAmt*0.35);
  const ph=frame*0.13;
  // Outer corona
  const og=ctx.createRadialGradient(fbPos.x,fbPos.y,0,fbPos.x,fbPos.y,sz*3);
  og.addColorStop(0,`rgba(255,200,50,${pct*0.45})`);
  og.addColorStop(0.5,`rgba(255,80,0,${pct*0.25})`);
  og.addColorStop(1,'rgba(255,0,0,0)');
  ctx.fillStyle=og; ctx.beginPath(); ctx.arc(fbPos.x,fbPos.y,sz*3,0,Math.PI*2); ctx.fill();
  // Core
  const cg=ctx.createRadialGradient(fbPos.x-sz*0.25,fbPos.y-sz*0.25,0,fbPos.x,fbPos.y,sz);
  cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.18,'#ffee44'); cg.addColorStop(0.55,'#ff6600'); cg.addColorStop(1,'rgba(255,20,0,0.05)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(fbPos.x,fbPos.y,sz,0,Math.PI*2); ctx.fill();
  // Flame tongues
  const tongues=bothHands?10:6;
  for(let i=0;i<tongues;i++){
    const a=(i/tongues)*Math.PI*2+ph;
    const tl=sz*(0.85+Math.sin(ph*2+i*0.9)*0.28);
    const fx=fbPos.x+Math.cos(a)*tl, fy=fbPos.y+Math.sin(a)*tl;
    const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,sz*(bothHands?0.5:0.38));
    fg.addColorStop(0,`rgba(255,${130+Math.floor(pct*80)},0,${0.7+pct*0.3})`);
    fg.addColorStop(1,'rgba(255,50,0,0)');
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(fx,fy,sz*(bothHands?0.5:0.38),0,Math.PI*2); ctx.fill();
  }
  // Charge ring
  ctx.beginPath();
  ctx.arc(fbPos.x,fbPos.y,sz+10+Math.sin(ph*4)*3,0,Math.PI*2*pct);
  ctx.strokeStyle=`rgba(255,230,80,${0.45+pct*0.5})`;
  ctx.lineWidth=bothHands?3:2; ctx.stroke();
  // Sparks around it
  if(Math.random()<0.4){
    const sa=Math.random()*Math.PI*2, sd=sz*1.2+Math.random()*sz*0.8;
    particles.push({x:fbPos.x+Math.cos(sa)*sd,y:fbPos.y+Math.sin(sa)*sd,vx:(Math.random()-0.5)*2,vy:-1-Math.random()*2,size:2+Math.random()*3,color:bothHands?'#ffe080':'#ff9900',life:0.8,decay:0.04,gravity:-0.02});
  }
}

// ── Hand overlay drawing ─────────────────────────────
function drawHandOverlay(){
  hctx.clearRect(0,0,W,H);
  if(!hands.length) return;
  const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  hands.forEach(hand=>{
    const pts=hand.map(lm=>({x:(1-lm.x)*W,y:lm.y*H}));
    CONN.forEach(([a,b])=>{
      hctx.beginPath(); hctx.moveTo(pts[a].x,pts[a].y); hctx.lineTo(pts[b].x,pts[b].y);
      hctx.strokeStyle=charging?`rgba(255,${100+Math.floor(chargeAmt)},0,0.65)`:'rgba(255,180,80,0.4)';
      hctx.lineWidth=2.5; hctx.stroke();
    });
    pts.forEach((p,i)=>{
      hctx.beginPath(); hctx.arc(p.x,p.y,i===0?7:3.5,0,Math.PI*2);
      hctx.fillStyle=charging?`rgba(255,${120+Math.floor(chargeAmt)},0,0.85)`:'rgba(255,160,50,0.65)';
      hctx.fill();
    });
  });
}

// ── MediaPipe ────────────────────────────────────────
let mpHands=null;
function setupMP(){
  mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
  mpHands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.65,minTrackingConfidence:0.5});
  mpHands.onResults(onHands);
  const cam=new Camera(vid,{onFrame:async()=>{if(mpHands&&state==='playing')await mpHands.send({image:vid});},width:640,height:480});
  cam.start();
}

function palmPt(h){ return {x:(1-h[9].x)*W,y:h[9].y*H}; }
function isFist(h){
  const p=palmPt(h);
  const tips=[h[8],h[12],h[16],h[20]], knuckles=[h[6],h[10],h[14],h[18]];
  let c=0;
  tips.forEach((t,i)=>{
    const td=Math.hypot((1-t.x)*W-p.x,t.y*H-p.y);
    const kd=Math.hypot((1-knuckles[i].x)*W-p.x,knuckles[i].y*H-p.y);
    if(td<kd*1.3) c++;
  });
  return c>=3;
}

let prevFist=[false,false], prevPalmPts=[];

function onHands(results){
  hands=results.multiHandLandmarks||[];
  if(state!=='playing') return;

  const n=hands.length;
  const fists=hands.map(isFist);
  const palms=hands.map(palmPt);

  // ── TWO HANDS ──
  if(n>=2){
    const p1=palms[0], p2=palms[1];
    const dist=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    const cx=(p1.x+p2.x)/2, cy=(p1.y+p2.y)/2;
    bothHands=true;

    if(dist<220){ // hands cupped together
      if(!charging){ charging=true; chargeT=Date.now(); showStatus('🤲 CHARGING MEGA FIREBALL...'); }
      const elapsed=(Date.now()-chargeT)/1000;
      chargeAmt=Math.min(100,elapsed*55);
      fbPos={x:cx,y:cy};
    } else {
      // Throw if was charging
      if(charging && chargeAmt>15){
        const dy=cy-(prevPalmPts[0]?.y||cy);
        const vy=-16+dy*6;
        const vx=(cx-W/2)*0.04;
        balls.push(new Ball(fbPos.x,fbPos.y,vx+( Math.random()-0.5)*2,vy,true));
        burst(fbPos.x,fbPos.y,25,['#ffee44','#ff8800','#ff4400','#ffffff'],[4,14],[3,8]);
        showStatus('💥 MEGA FIREBALL!');
        charging=false; chargeAmt=0; bothHands=false;
      } else { charging=false; chargeAmt=Math.max(0,chargeAmt-3); }
    }
    prevPalmPts=palms;
  }
  // ── ONE HAND ──
  else if(n===1){
    bothHands=false;
    const p=palms[0], isFst=fists[0];
    const wasF=prevFist[0];

    if(isFst){
      if(!charging){ charging=true; chargeT=Date.now(); showStatus('✊ Charging fireball...'); }
      const elapsed=(Date.now()-chargeT)/1000;
      chargeAmt=Math.min(100,elapsed*45);
      fbPos={x:p.x,y:p.y};
    } else {
      // Open hand = throw
      if(charging && chargeAmt>18){
        const dy=p.y-(prevPalmPts[0]?.y||p.y);
        balls.push(new Ball(fbPos.x,fbPos.y,(p.x-W/2)*0.05,-15+dy*5,false));
        burst(fbPos.x,fbPos.y,14,['#ffee44','#ff8800','#ff4400'],[3,9],[2,6]);
        showStatus('🔥 Fired!');
        charging=false; chargeAmt=0;
      } else if(!charging){ chargeAmt=Math.max(0,chargeAmt-2); }
    }
    prevFist[0]=isFst; prevPalmPts=[p];
  } else {
    // No hands
    bothHands=false;
    if(charging){ charging=false; chargeAmt=Math.max(0,chargeAmt-2); }
  }
}

// ── Collision ─────────────────────────────────────────
function checkHits(){
  balls.forEach(b=>{
    meteors.forEach(m=>{
      if(!m.alive||!b.alive) return;
      const d=Math.hypot(b.x-m.x,b.y-m.y);
      if(d<b.size+m.size){
        m.alive=false; b.alive=false;
        burst(m.x,m.y,35,['#ffee44','#ff8800','#ff4400','#ff2200','#ffffff'],[3,14],[2,9]);
        score+=b.big?25:10;
        document.getElementById('scorePill').textContent='⭐ '+score;
        shakeX=10; shakeY=8;
      }
    });
  });
}

function meteorHit(m){
  const sec=Math.max(0,Math.min(7,Math.floor(m.x/SEC_W())));
  cityDmg[sec]=Math.min(3,cityDmg[sec]+1);
  burst(m.x,CITY_Y(),30,['#ff8800','#ff4400','#cc2200','#ffcc00'],[4,16],[2,9]);
  shakeX=14; shakeY=12;
  const total=cityDmg.reduce((a,b)=>a+b,0);
  cityHp=Math.max(0,Math.round(100-total/(8*3)*100));
  document.getElementById('hpFill').style.width=cityHp+'%';
  const p=cityHp/100;
  document.getElementById('hpFill').style.background=p>0.55?'linear-gradient(90deg,#ff3300,#ffaa00)':p>0.28?'linear-gradient(90deg,#ff2200,#ff5500)':'linear-gradient(90deg,#cc0000,#ff2200)';
  if(cityHp<=0) endGame(false);
}

// ── Game loop ──────────────────────────────────────────
function gameLoop(){
  if(state!=='playing') return;
  frame++;
  shakeX*=0.82; shakeY*=0.82;
  ctx.save(); ctx.translate(shakeX*(Math.random()-0.5)*2,shakeY*(Math.random()-0.5)*2);
  ctx.clearRect(-30,-30,W+60,H+60);
  drawSky();
  drawCity();
  tickParticles();
  meteors=meteors.filter(m=>m.alive);
  meteors.forEach(m=>{ if(m.update()){m.alive=false;meteorHit(m);} else m.draw(); });
  balls=balls.filter(b=>b.alive);
  balls.forEach(b=>{ b.update(); b.draw(); });
  checkHits();
  drawChargeFB();
  ctx.restore();
  drawHandOverlay();
  requestAnimationFrame(gameLoop);
}

function spawnMeteor(){
  if(state!=='playing') return;
  meteors.push(new Meteor());
  const delay=Math.max(500,2200-(120-timeLeft)*12);
  sTimer=setTimeout(spawnMeteor,delay+Math.random()*600);
}
function tickTimer(){
  if(state!=='playing') return;
  timeLeft--;
  const m=Math.floor(timeLeft/60), s=(timeLeft%60).toString().padStart(2,'0');
  document.getElementById('timerPill').textContent=m+':'+s;
  if(timeLeft<=0) endGame(true);
  else if(timeLeft<=20) document.getElementById('timerPill').style.color='#ff4444';
  gTimer=setTimeout(tickTimer,1000);
}

async function initGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('cdScreen').style.display='flex';
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});
    vid.srcObject=s; await vid.play(); setupMP();
  } catch(e){ console.warn('No webcam:',e); }
  buildCity(); countdown(3);
}
function countdown(n){
  const el=document.getElementById('cdNum');
  if(n===0){ el.textContent='GO!'; el.style.color='rgba(255,220,80,0.85)';
    setTimeout(()=>{ document.getElementById('cdScreen').style.display='none'; startPlay(); },700); return; }
  el.textContent=n; el.style.animation='none'; void el.offsetWidth; el.style.animation='cdPop 0.7s cubic-bezier(.2,1.4,.6,1)';
  setTimeout(()=>countdown(n-1),900);
}
function startPlay(){
  state='playing';
  document.getElementById('ui').style.display='flex';
  document.getElementById('gesture-status').style.display='block';
  showStatus('✊ Fist = fireball · 🤲 Both hands = MEGA!');
  spawnMeteor(); tickTimer(); gameLoop();
}
function endGame(won){
  state='ended';
  clearTimeout(gTimer); clearTimeout(sTimer);
  const es=document.getElementById('endScreen');
  es.style.display='flex';
  const et=document.getElementById('endTitle'), esub=document.getElementById('endSub');
  if(won){
    es.style.background='linear-gradient(180deg,rgba(0,25,5,0.93),rgba(0,10,0,0.97))';
    et.textContent='YOU WIN! 🏆'; et.style.color='#66ff44'; et.style.textShadow='0 0 60px #44ff00,0 0 120px #22aa00, 4px 4px 0 #114400';
    esub.textContent='City survived! Final score: '+score;
    burst(W/2,H/2,60,['#ffee44','#88ff44','#ffffff','#ffaa00'],[3,12],[2,10]);
  } else {
    es.style.background='linear-gradient(180deg,rgba(20,0,0,0.94),rgba(0,0,0,0.98))';
    et.textContent='GAME OVER 💀'; et.style.color='#ff2200'; et.style.textShadow='0 0 60px #ff0000,0 0 120px #880000, 4px 4px 0 #330000';
    esub.textContent='The city fell... Score: '+score;
    burst(W/2,H*0.6,50,['#ff4400','#ff2200','#cc0000','#ff8800'],[5,18],[3,11]);
  }
}
function restartGame(){
  state='start'; cityHp=100; score=0; timeLeft=120;
  meteors=[]; balls=[]; particles=[]; cityDmg=Array(8).fill(0);
  shakeX=0; shakeY=0; frame=0; charging=false; chargeAmt=0; bothHands=false;
  document.getElementById('hpFill').style.width='100%';
  document.getElementById('scorePill').textContent='⭐ 0';
  document.getElementById('timerPill').textContent='2:00';
  document.getElementById('timerPill').style.color='#ffaa44';
  document.getElementById('ui').style.display='none';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('startScreen').style.display='flex';
  buildCity();
}

// ── Keyboard fallbacks ────────────────────────────────
document.addEventListener('keydown',e=>{
  if(state!=='playing') return;
  if(e.code==='Space'){
    charging=true; chargeAmt=80; fbPos={x:W/2,y:H*0.5};
    balls.push(new Ball(W/2,H*0.5,(Math.random()-0.5)*3,-16,false));
    charging=false; chargeAmt=0;
  }
  if(e.code==='KeyB') balls.push(new Ball(W/2,H*0.45,(Math.random()-0.5)*2,-16,true));
});
gc.addEventListener('click',e=>{ if(state==='playing') balls.push(new Ball(e.clientX,e.clientY,(Math.random()-0.5)*3,-14,false)); });

// Idle render on start
(function idle(){
  if(state==='start'||state==='ended'){ frame++; ctx.clearRect(0,0,W,H); drawSky(); drawCity(); tickParticles(); requestAnimationFrame(idle); }
})();
</script>
